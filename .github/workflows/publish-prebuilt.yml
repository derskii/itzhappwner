name: Publish verified APK

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Source commit with a successful Android CI run
        required: true
      artifact_ref:
        description: Branch containing the signed APK at repository root
        required: true
      apk_sha256:
        description: Expected SHA-256 of the signed APK
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      ARTIFACT_REF: ${{ inputs.artifact_ref }}
      APK_SHA256: ${{ inputs.apk_sha256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Require successful source verification
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          source = os.environ['SOURCE_SHA']
          digest = os.environ['APK_SHA256']
          if not re.fullmatch(r'[0-9a-f]{40}', source) or not re.fullmatch(r'[0-9a-f]{64}', digest):
              raise SystemExit('Invalid source SHA or APK digest')
          if not re.fullmatch(r'release-artifact/[A-Za-z0-9._-]+', os.environ['ARTIFACT_REF']):
              raise SystemExit('Invalid artifact branch')
          repo = os.environ['GITHUB_REPOSITORY']
          data = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/actions/workflows/android.yml/runs?head_sha={source}']))
          if not any(run['head_sha'] == source and run['conclusion'] == 'success' for run in data['workflow_runs']):
              raise SystemExit('Source commit has no successful Android CI run')
          PY
      - name: Retrieve signed APK and matching release notes
        run: |
          git fetch origin "$ARTIFACT_REF"
          mkdir -p dist
          git show FETCH_HEAD:Happwner-1.3.3-api102.apk > dist/Happwner-1.3.3-api102.apk
          git fetch origin "$SOURCE_SHA"
          git show "$SOURCE_SHA:docs/releases/v1.3.3-api102.md" > "$RUNNER_TEMP/release-notes.md"
          printf '%s  %s\n' "$APK_SHA256" 'Happwner-1.3.3-api102.apk' > dist/SHA256SUMS.txt
          cd dist
          sha256sum --check SHA256SUMS.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Verify signature and alignment
        run: |
          sdkmanager 'build-tools;36.0.0'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/*.apk | tee "$RUNNER_TEMP/signature.txt"
          grep -F 'Signer #1 certificate SHA-256 digest: 2785359e92ef8f82c8e2d80b07901435fdb6539560ff7a8e6598b2eb90c197ac' "$RUNNER_TEMP/signature.txt"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 dist/*.apk
      - name: Publish APK and checksums
        run: |
          if ! gh release view v1.3.3-api102 >/dev/null 2>&1; then
            gh release create v1.3.3-api102 --draft --target "$SOURCE_SHA" --title 'Happwner 1.3.3-api102' --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload v1.3.3-api102 dist/* --clobber
          gh release edit v1.3.3-api102 --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false --latest
